<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<vbox
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })"
  style="display: grid; grid-template-columns: 1fr; gap: 10px"
>
  <html:h2 data-l10n-id="pref-title"></html:h2>

  <html:h3 data-l10n-id="pref-llm-header"></html:h3>
  <vbox>
    <html:label
      for="zotero-prefpane-__addonRef__-llm-apikey"
      data-l10n-id="pref-llm-apikey"
    ></html:label>
    <html:input
      type="password"
      id="zotero-prefpane-__addonRef__-llm-apikey"
      style="width: 100%"
    />
  </vbox>
  <vbox>
    <html:label
      for="zotero-prefpane-__addonRef__-llm-baseurl"
      data-l10n-id="pref-llm-baseurl"
    ></html:label>
    <html:input
      type="text"
      id="zotero-prefpane-__addonRef__-llm-baseurl"
      style="width: 100%"
    />
    <html:label
      data-l10n-id="pref-llm-baseurl-hint"
      style="color: gray; font-size: small"
    ></html:label>
  </vbox>
  <vbox>
    <html:label
      for="zotero-prefpane-__addonRef__-llm-model"
      data-l10n-id="pref-llm-model"
    ></html:label>
    <html:input
      type="text"
      id="zotero-prefpane-__addonRef__-llm-model"
      style="width: 100%"
    />
  </vbox>
  <hbox align="center" style="gap: 10px">
    <html:button
      id="zotero-prefpane-__addonRef__-llm-test"
      data-l10n-id="pref-llm-test"
    ></html:button>
    <html:label
      id="zotero-prefpane-__addonRef__-llm-test-result"
      flex="1"
    ></html:label>
  </hbox>

  <html:h3 data-l10n-id="pref-fetch-header"></html:h3>
  <hbox style="gap: 10px">
    <vbox flex="1">
      <html:label
        for="zotero-prefpane-__addonRef__-fetch-days"
        data-l10n-id="pref-fetch-days"
      ></html:label>
      <html:input
        type="number"
        min="1"
        max="60"
        id="zotero-prefpane-__addonRef__-fetch-days"
        style="width: 100px"
      />
    </vbox>
    <vbox flex="1">
      <html:label
        for="zotero-prefpane-__addonRef__-fetch-workers"
        data-l10n-id="pref-fetch-workers"
      ></html:label>
      <html:input
        type="number"
        min="1"
        max="10"
        id="zotero-prefpane-__addonRef__-fetch-workers"
        style="width: 100px"
      />
    </vbox>
  </hbox>

  <html:h3 data-l10n-id="pref-feeds-header"></html:h3>
  <html:label data-l10n-id="pref-feeds-label"></html:label>
  <html:textarea
    id="zotero-prefpane-__addonRef__-feeds-list"
    rows="8"
    style="width: 100%; font-family: monospace"
  ></html:textarea>

  <html:h3 data-l10n-id="pref-research-header"></html:h3>
  <html:label data-l10n-id="pref-research-direction-label"></html:label>
  <html:textarea
    id="zotero-prefpane-__addonRef__-research-direction"
    rows="4"
    style="width: 100%"
  ></html:textarea>
  <html:label
    data-l10n-id="pref-research-criteria-label"
    style="margin-top: 6px"
  ></html:label>
  <html:label
    data-l10n-id="pref-research-warning"
    style="color: #b3500d"
  ></html:label>
  <html:textarea
    id="zotero-prefpane-__addonRef__-research-criteria"
    rows="10"
    style="width: 100%"
  ></html:textarea>
  <hbox align="center" style="gap: 10px">
    <html:button
      id="zotero-prefpane-__addonRef__-research-generate"
      data-l10n-id="pref-research-generate"
    ></html:button>
    <html:label
      id="zotero-prefpane-__addonRef__-research-generate-result"
      flex="1"
    ></html:label>
  </hbox>

  <html:h3 data-l10n-id="pref-output-header"></html:h3>
  <hbox style="gap: 10px">
    <vbox flex="1">
      <html:label
        for="zotero-prefpane-__addonRef__-collection-name"
        data-l10n-id="pref-collection-name"
      ></html:label>
      <html:input
        type="text"
        id="zotero-prefpane-__addonRef__-collection-name"
        style="width: 100%"
      />
    </vbox>
    <vbox flex="1">
      <html:label
        for="zotero-prefpane-__addonRef__-tags-research"
        data-l10n-id="pref-tags-research"
      ></html:label>
      <html:input
        type="text"
        id="zotero-prefpane-__addonRef__-tags-research"
        style="width: 100%"
      />
    </vbox>
  </hbox>

  <html:h3 data-l10n-id="pref-autorun-header"></html:h3>
  <hbox align="center" style="gap: 6px">
    <html:input
      type="checkbox"
      id="zotero-prefpane-__addonRef__-autorun-enable"
    />
    <html:label
      for="zotero-prefpane-__addonRef__-autorun-enable"
      data-l10n-id="pref-autorun-enable"
    ></html:label>
  </hbox>
  <vbox>
    <html:label
      for="zotero-prefpane-__addonRef__-autorun-interval"
      data-l10n-id="pref-autorun-interval"
    ></html:label>
    <html:input
      type="number"
      min="1"
      max="720"
      id="zotero-prefpane-__addonRef__-autorun-interval"
      style="width: 100px"
    />
  </vbox>

  <html:button
    id="zotero-prefpane-__addonRef__-run-now"
    data-l10n-id="pref-run-now"
  ></html:button>

  <html:label
    data-l10n-id="pref-help"
    data-l10n-args='{"time": "__buildTime__","name": "__addonName__","version":"__buildVersion__"}'
  ></html:label>
</vbox>
