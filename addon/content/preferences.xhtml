<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<vbox
  id="zotero-prefpane-__addonRef__-root"
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })"
  style="display: grid; grid-template-columns: 1fr; gap: 10px"
>
  <html:h2 data-l10n-id="pref-title"></html:h2>

  <html:details
    id="zotero-prefpane-__addonRef__-llm-details"
    style="margin-bottom: 5px"
  >
    <html:summary
      style="cursor: pointer; user-select: none; outline: none; padding: 4px 0"
    >
      <html:h3
        data-l10n-id="pref-llm-header"
        style="display: inline; margin: 0"
      ></html:h3>
      <html:span
        id="zotero-prefpane-__addonRef__-llm-summary-badge"
        style="
          color: gray;
          font-size: small;
          font-weight: normal;
          margin-left: 8px;
        "
      ></html:span>
    </html:summary>
    <vbox
      style="
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
        margin-top: 10px;
      "
    >
      <vbox>
        <html:label
          for="zotero-prefpane-__addonRef__-llm-profile-select"
          data-l10n-id="pref-llm-profile-select"
        ></html:label>
        <hbox align="center" style="gap: 8px">
          <html:select
            id="zotero-prefpane-__addonRef__-llm-profile-select"
            style="flex: 1; padding: 4px"
          ></html:select>
          <html:button
            id="zotero-prefpane-__addonRef__-llm-profile-add"
            data-l10n-id="pref-llm-profile-add"
          ></html:button>
          <html:button
            id="zotero-prefpane-__addonRef__-llm-profile-delete"
            data-l10n-id="pref-llm-profile-delete"
          ></html:button>
        </hbox>
      </vbox>
      <vbox>
        <html:label
          for="zotero-prefpane-__addonRef__-llm-profile-name"
          data-l10n-id="pref-llm-profile-name"
        ></html:label>
        <html:input
          type="text"
          id="zotero-prefpane-__addonRef__-llm-profile-name"
          style="width: 100%"
        />
      </vbox>
      <vbox>
        <html:label
          for="zotero-prefpane-__addonRef__-llm-baseurl"
          data-l10n-id="pref-llm-baseurl"
        ></html:label>
        <html:input
          type="text"
          id="zotero-prefpane-__addonRef__-llm-baseurl"
          style="width: 100%"
        />
        <html:label
          data-l10n-id="pref-llm-baseurl-hint"
          style="color: gray; font-size: small"
        ></html:label>
      </vbox>
      <vbox>
        <html:label
          for="zotero-prefpane-__addonRef__-llm-apikey"
          data-l10n-id="pref-llm-apikey"
        ></html:label>
        <html:input
          type="password"
          id="zotero-prefpane-__addonRef__-llm-apikey"
          style="width: 100%"
        />
      </vbox>
      <vbox>
        <html:label
          for="zotero-prefpane-__addonRef__-llm-model"
          data-l10n-id="pref-llm-model"
        ></html:label>
        <html:input
          type="text"
          id="zotero-prefpane-__addonRef__-llm-model"
          style="width: 100%"
        />
      </vbox>
      <hbox align="center" style="gap: 10px">
        <html:button
          id="zotero-prefpane-__addonRef__-llm-test"
          data-l10n-id="pref-llm-test"
        ></html:button>
        <html:label
          id="zotero-prefpane-__addonRef__-llm-test-result"
          flex="1"
        ></html:label>
      </hbox>
      <vbox>
        <html:label
          for="zotero-prefpane-__addonRef__-elsevier-apikey"
          data-l10n-id="pref-elsevier-apikey"
        ></html:label>
        <html:input
          type="text"
          id="zotero-prefpane-__addonRef__-elsevier-apikey"
          style="width: 100%"
        />
        <html:label data-l10n-id="pref-elsevier-apikey-hint"></html:label>
      </vbox>
    </vbox>
  </html:details>

  <html:h3 data-l10n-id="pref-fetch-header"></html:h3>
  <hbox style="gap: 10px">
    <vbox flex="1">
      <html:label
        for="zotero-prefpane-__addonRef__-fetch-days"
        data-l10n-id="pref-fetch-days"
      ></html:label>
      <html:input
        type="number"
        min="1"
        max="60"
        id="zotero-prefpane-__addonRef__-fetch-days"
        style="width: 100px"
      />
    </vbox>
    <vbox flex="1">
      <html:label
        for="zotero-prefpane-__addonRef__-fetch-workers"
        data-l10n-id="pref-fetch-workers"
      ></html:label>
      <html:input
        type="number"
        min="1"
        max="10"
        id="zotero-prefpane-__addonRef__-fetch-workers"
        style="width: 100px"
      />
    </vbox>
  </hbox>

  <html:details
    id="zotero-prefpane-__addonRef__-feeds-details"
    open="true"
    style="margin-bottom: 5px"
  >
    <html:summary
      style="cursor: pointer; user-select: none; outline: none; padding: 4px 0"
    >
      <html:h3
        data-l10n-id="pref-feeds-header"
        style="display: inline; margin: 0"
      ></html:h3>
      <html:span
        id="zotero-prefpane-__addonRef__-feeds-count-badge"
        style="
          color: gray;
          font-size: small;
          font-weight: normal;
          margin-left: 8px;
        "
      ></html:span>
    </html:summary>
    <vbox
      style="
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
        margin-top: 10px;
      "
    >
      <hbox align="center" style="justify-content: space-between">
        <html:label data-l10n-id="pref-feeds-label"></html:label>
        <hbox align="center" style="gap: 8px">
          <html:a
            id="zotero-prefpane-__addonRef__-feeds-help"
            href="#"
            style="cursor: pointer; color: #0670c0"
            data-l10n-id="pref-feeds-help"
          ></html:a>
          <html:button
            id="zotero-prefpane-__addonRef__-feeds-reset"
            data-l10n-id="pref-feeds-reset"
          ></html:button>
        </hbox>
      </hbox>
      <html:textarea
        id="zotero-prefpane-__addonRef__-feeds-list"
        rows="8"
        style="width: 100%; font-family: monospace"
      ></html:textarea>
      <hbox align="center" style="gap: 10px">
        <html:button
          id="zotero-prefpane-__addonRef__-feeds-test"
          data-l10n-id="pref-feeds-test"
        ></html:button>
        <html:label
          id="zotero-prefpane-__addonRef__-feeds-test-result"
          flex="1"
        ></html:label>
      </hbox>
    </vbox>
  </html:details>

  <html:details
    id="zotero-prefpane-__addonRef__-crossref-details"
    open="true"
    style="margin-bottom: 5px"
  >
    <html:summary
      style="cursor: pointer; user-select: none; outline: none; padding: 4px 0"
    >
      <html:h3
        data-l10n-id="pref-crossref-header"
        style="display: inline; margin: 0"
      ></html:h3>
      <html:span
        id="zotero-prefpane-__addonRef__-crossref-count-badge"
        style="
          color: gray;
          font-size: small;
          font-weight: normal;
          margin-left: 8px;
        "
      ></html:span>
    </html:summary>
    <vbox
      style="
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
        margin-top: 10px;
      "
    >
      <hbox align="center" style="gap: 6px">
        <html:input
          type="checkbox"
          id="zotero-prefpane-__addonRef__-crossref-enable"
        />
        <html:label
          for="zotero-prefpane-__addonRef__-crossref-enable"
          data-l10n-id="pref-crossref-enable"
        ></html:label>
      </hbox>
      <vbox>
        <html:label
          for="zotero-prefpane-__addonRef__-crossref-rows"
          data-l10n-id="pref-crossref-rows"
        ></html:label>
        <html:input
          type="number"
          min="1"
          max="1000"
          id="zotero-prefpane-__addonRef__-crossref-rows"
          style="width: 100px"
        />
      </vbox>
      <hbox align="center" style="justify-content: space-between">
        <html:label data-l10n-id="pref-crossref-journals-label"></html:label>
        <hbox align="center" style="gap: 8px">
          <html:a
            id="zotero-prefpane-__addonRef__-journals-help"
            href="#"
            style="cursor: pointer; color: #0670c0"
            data-l10n-id="pref-crossref-help"
          ></html:a>
          <html:button
            id="zotero-prefpane-__addonRef__-journals-reset"
            data-l10n-id="pref-crossref-reset"
          ></html:button>
        </hbox>
      </hbox>
      <html:textarea
        id="zotero-prefpane-__addonRef__-journals-list"
        rows="10"
        style="width: 100%; font-family: monospace"
      ></html:textarea>
      <hbox align="center" style="gap: 10px">
        <html:button
          id="zotero-prefpane-__addonRef__-journals-test"
          data-l10n-id="pref-crossref-test"
        ></html:button>
        <html:label
          id="zotero-prefpane-__addonRef__-journals-test-result"
          flex="1"
        ></html:label>
      </hbox>
    </vbox>
  </html:details>

  <html:details
    id="zotero-prefpane-__addonRef__-research-details"
    open="true"
    style="margin-bottom: 5px"
  >
    <html:summary
      style="cursor: pointer; user-select: none; outline: none; padding: 4px 0"
    >
      <html:h3
        data-l10n-id="pref-research-header"
        style="display: inline; margin: 0"
      ></html:h3>
    </html:summary>
    <vbox
      style="
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
        margin-top: 10px;
      "
    >
      <html:label data-l10n-id="pref-research-direction-label"></html:label>
      <html:textarea
        id="zotero-prefpane-__addonRef__-research-direction"
        rows="4"
        style="width: 100%"
      ></html:textarea>
      <html:label
        data-l10n-id="pref-research-criteria-label"
        style="margin-top: 6px"
      ></html:label>
      <html:label
        data-l10n-id="pref-research-warning"
        style="color: #b3500d"
      ></html:label>
      <html:textarea
        id="zotero-prefpane-__addonRef__-research-criteria"
        rows="10"
        style="width: 100%"
      ></html:textarea>
      <hbox align="center" style="gap: 10px">
        <html:button
          id="zotero-prefpane-__addonRef__-research-generate"
          data-l10n-id="pref-research-generate"
        ></html:button>
        <html:label
          id="zotero-prefpane-__addonRef__-research-generate-result"
          flex="1"
        ></html:label>
      </hbox>
    </vbox>
  </html:details>

  <html:h3 data-l10n-id="pref-output-header"></html:h3>
  <hbox style="gap: 10px">
    <vbox flex="1">
      <html:label
        for="zotero-prefpane-__addonRef__-collection-name"
        data-l10n-id="pref-collection-name"
      ></html:label>
      <html:input
        type="text"
        id="zotero-prefpane-__addonRef__-collection-name"
        style="width: 100%"
      />
    </vbox>
    <vbox flex="1">
      <html:label
        for="zotero-prefpane-__addonRef__-collection-thesis-name"
        data-l10n-id="pref-collection-thesis-name"
      ></html:label>
      <html:input
        type="text"
        id="zotero-prefpane-__addonRef__-collection-thesis-name"
        style="width: 100%"
      />
    </vbox>
    <vbox flex="1">
      <html:label
        for="zotero-prefpane-__addonRef__-tags-research"
        data-l10n-id="pref-tags-research"
      ></html:label>
      <html:input
        type="text"
        id="zotero-prefpane-__addonRef__-tags-research"
        style="width: 100%"
      />
    </vbox>
  </hbox>

  <html:h3 data-l10n-id="pref-autorun-header"></html:h3>
  <hbox align="center" style="gap: 6px">
    <html:input
      type="checkbox"
      id="zotero-prefpane-__addonRef__-autorun-enable"
    />
    <html:label
      for="zotero-prefpane-__addonRef__-autorun-enable"
      data-l10n-id="pref-autorun-enable"
    ></html:label>
  </hbox>
  <vbox>
    <html:label
      for="zotero-prefpane-__addonRef__-autorun-interval"
      data-l10n-id="pref-autorun-interval"
    ></html:label>
    <html:input
      type="number"
      min="1"
      max="30"
      id="zotero-prefpane-__addonRef__-autorun-interval"
      style="width: 100px"
    />
  </vbox>

  <html:button
    id="zotero-prefpane-__addonRef__-run-now"
    data-l10n-id="pref-run-now"
  ></html:button>

  <html:label
    data-l10n-id="pref-help"
    data-l10n-args='{"time": "__buildTime__","name": "__addonName__","version":"__buildVersion__"}'
  ></html:label>
</vbox>
